      "title": "Chemical potential: the slope, or the intercept?",
      "body": "A free-energy curve is familiar enough that it is easy to read too much into its slope. For a binary **molar Gibbs free energy** \\\\(g(x_B)\\\\), at fixed temperature and pressure, the slope is the difference between the two chemical potentials:\n\n<div class=\"formula-box\">\\[\\frac{dg}{dx_B}=\\mu_B-\\mu_A.\\]</div>\n\nThe tangent drawn at the composition of interest intersects the vertical lines at \\\\(x_B=0\\\\) and \\\\(x_B=1\\\\) at the values \\\\(\\mu_A\\\\) and \\\\(\\mu_B\\\\), respectively:\n\n<div class=\"formula-box\">\\[\\begin{aligned}\\mu_A&=g-x_B\\frac{dg}{dx_B},\\\\\\mu_B&=g+(1-x_B)\\frac{dg}{dx_B}.\\end{aligned}\\]</div>\n\nThis is why a common tangent gives equality of **both** component chemical potentials between two phases. Its intercepts refer to chemical potentials at the tangent composition, not necessarily to the pure-component free energies.\n\nThere is a useful subtlety here. In phase-field models, the quantity called a chemical potential may instead be a variational derivative with respect to a conserved field. With a binary composition constraint it is often an exchange or diffusion potential. Calling that a free-energy derivative is appropriate; identifying it with one individual component’s **partial molar Gibbs free energy in the given phase, or simply its chemical potential** is the source of confusion. If the plotted curve is only the mixing free energy, its intercepts give chemical-potential changes relative to the chosen pure-component references.\n\n**A question for discussion:** Which free energy is on the vertical axis, which composition variable is on the horizontal axis, and what is held fixed when we differentiate?\n\nFurther reading: [Caltech’s binary phase-equilibria tutorial](https://web.gps.caltech.edu/~asimow/tutorial1.html).\n\n### Parallel tangents are not enough\n\nWe sometimes invoke a parallel-tangent construction when equilibrium actually requires a common tangent. The algebra behind the distinction is simple:\n\n<div class=\"formula-box\">\\[a-b=c-d\\quad\\not\\Rightarrow\\quad a=c\\ \\text{and}\\ b=d.\\]</div>\n\nFor example, 5 − 3 = 8 − 6, but 5 ≠ 8 and 3 ≠ 6. Equal differences do not imply equality of the individual quantities.\n\nFor two phases, parallel tangents establish only\n\n<div class=\"formula-box\">\\[\\mu_B^{\\alpha}-\\mu_A^{\\alpha}=\\mu_B^{\\beta}-\\mu_A^{\\beta}.\\]</div>\n\nAt ordinary binary phase equilibrium, with both components free to exchange at the same temperature and pressure, we instead require\n\n<div class=\"formula-box\">\\[\\mu_A^{\\alpha}=\\mu_A^{\\beta},\\qquad\\mu_B^{\\alpha}=\\mu_B^{\\beta}.\\]</div>\n\nA **common tangent** has the same slope and the same intercepts on the two molar Gibbs free-energy curves. Parallel tangents may have different intercepts: they fix the difference between the chemical potentials without fixing either one separately. For stable equilibrium, the common tangent must also support the lower free-energy envelope, rather than merely touch two metastable branches.\n\n**A question for discussion:** If two tangents are parallel but vertically displaced, which equilibrium condition have we checked, and which have we missed? This discussion assumes ordinary bulk phase equilibrium; additional constraints or coherent elastic contributions require the appropriate constrained thermodynamic formulation.\n"
