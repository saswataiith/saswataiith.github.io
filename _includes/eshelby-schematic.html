<figure class="eshelby-schematic" aria-labelledby="eshelby-schematic-caption">
  <svg viewBox="0 0 1240 350" role="img" aria-labelledby="eshelby-svg-title eshelby-svg-desc">
    <title id="eshelby-svg-title">Eshelby inclusion thought experiment</title>
    <desc id="eshelby-svg-desc">Five stages show a region cut from a matrix, transformed freely, elastically strained to fit, welded into the matrix, and relaxed to its equilibrium elastic field.</desc>
    <defs>
      <linearGradient id="matrix-wash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dff2fb"/><stop offset="1" stop-color="#c8e6f2"/></linearGradient>
      <linearGradient id="inclusion-wash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd79b"/><stop offset="1" stop-color="#ef9f62"/></linearGradient>
      <radialGradient id="stress-wash"><stop offset="0" stop-color="#fff4cf" stop-opacity=".9"/><stop offset=".58" stop-color="#83c9df" stop-opacity=".55"/><stop offset="1" stop-color="#dff2fb" stop-opacity="0"/></radialGradient>
      <marker id="eshelby-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#387a92"/></marker>
      <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#183f50" flood-opacity=".14"/></filter>
    </defs>

    <g class="eshelby-stage" transform="translate(20 30)">
      <text class="stage-number" x="0" y="0">01</text><text class="stage-title" x="36" y="0">CUT</text>
      <rect class="matrix" x="0" y="28" width="190" height="190" rx="12"/>
      <ellipse class="cut-line" cx="95" cy="123" rx="48" ry="66"/>
      <path class="cut-mark" d="M54 70l-9-9m91 9 9-9M54 176l-9 9m91-9 9 9"/>
      <text class="stage-note" x="95" y="250">Select a region</text>
    </g>
    <path class="process-arrow" d="M220 140h36"/>

    <g class="eshelby-stage" transform="translate(270 30)">
      <text class="stage-number" x="0" y="0">02</text><text class="stage-title" x="36" y="0">TRANSFORM FREELY</text>
      <rect class="empty-matrix" x="0" y="28" width="88" height="190" rx="12"/>
      <ellipse class="cavity" cx="44" cy="123" rx="24" ry="48"/>
      <ellipse class="inclusion free" cx="145" cy="123" rx="66" ry="42" filter="url(#soft-shadow)"/>
      <path class="free-arrows" d="M145 70v-18m0 142v-18M77 123H59m172 0h-18"/>
      <text class="stage-note" x="95" y="250">Apply eigenstrain ε⁰</text>
    </g>
    <path class="process-arrow" d="M470 140h36"/>

    <g class="eshelby-stage" transform="translate(520 30)">
      <text class="stage-number" x="0" y="0">03</text><text class="stage-title" x="36" y="0">STRAIN TO FIT</text>
      <ellipse class="inclusion" cx="95" cy="123" rx="48" ry="66" filter="url(#soft-shadow)"/>
      <path class="traction" d="M95 38v25m0 145v-25M25 123h27m113 0h-27"/>
      <text class="stage-note" x="95" y="250">Auxiliary tractions</text>
    </g>
    <path class="process-arrow" d="M720 140h36"/>

    <g class="eshelby-stage" transform="translate(770 30)">
      <text class="stage-number" x="0" y="0">04</text><text class="stage-title" x="36" y="0">WELD</text>
      <rect class="matrix" x="0" y="28" width="190" height="190" rx="12"/>
      <ellipse class="inclusion" cx="95" cy="123" rx="48" ry="66"/>
      <ellipse class="weld-line" cx="95" cy="123" rx="53" ry="71"/>
      <text class="stage-note" x="95" y="250">Enforce coherence</text>
    </g>
    <path class="process-arrow" d="M970 140h36"/>

    <g class="eshelby-stage" transform="translate(1020 30)">
      <text class="stage-number" x="0" y="0">05</text><text class="stage-title" x="36" y="0">RELAX</text>
      <rect class="matrix" x="0" y="28" width="190" height="190" rx="12"/>
      <ellipse cx="95" cy="123" rx="92" ry="92" fill="url(#stress-wash)"/>
      <path class="field-line" d="M20 101c25-25 44-30 75-30s50 5 75 30M20 145c25 25 44 30 75 30s50-5 75-30"/>
      <ellipse class="inclusion relaxed" cx="95" cy="123" rx="54" ry="56"/>
      <text class="stage-note" x="95" y="250">Mechanical equilibrium</text>
    </g>
  </svg>
  <figcaption id="eshelby-schematic-caption"><strong>Eshelby’s construction makes the source of stress visible.</strong> The free transformation is described by eigenstrain. Elastic strain appears when the transformed region must fit coherently inside the matrix.</figcaption>
</figure>
