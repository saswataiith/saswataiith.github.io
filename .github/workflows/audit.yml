name: Temporary Linux audit checks
on:
  push:
    branches: [audit-linux-verification-20261007]
jobs:
  python-and-c:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        target: [py-13, py-28]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: julia-actions/setup-julia@v2
        if: matrix.target == 'py-10'
        with:
          version: '1.12'
      - run: sudo apt-get update && sudo apt-get install -y libfftw3-dev
      - run: pip install numpy scipy numba scikit-image fast-simplification 'pillow>=10.1' matplotlib nbformat nbclient jupyter vpython "setuptools<82" playwright
      - run: python -m playwright install --with-deps chromium
        if: contains(matrix.target, 'py-')
      - run: python audit-verification/run.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-${{ matrix.target }}
          path: audit-reports/
