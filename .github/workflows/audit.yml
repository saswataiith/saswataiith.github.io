name: Temporary Linux audit checks
on:
  push:
    branches: [audit-linux-verification-20261007]
jobs:
  python-and-c:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        target: ["py-00", "py-01", "py-02", "py-03", "py-04", "py-05", "py-06", "py-07", "py-08", "py-09", "py-10", "py-11", "py-12", "py-13", "py-14", "py-15", "py-16", "py-17", "py-18", "py-19", "py-20", "py-21", "py-22", "py-23", "py-24", "py-25", "py-26", "py-27", "py-28", "py-29", "py-30", "nrcm"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: julia-actions/setup-julia@v2
        if: matrix.target == 'py-10'
        with:
          version: '1.12'
      - run: sudo apt-get update && sudo apt-get install -y libfftw3-dev
      - run: pip install numpy scipy numba scikit-image fast-simplification 'pillow>=10.1' matplotlib nbformat nbclient jupyter vpython setuptools playwright
      - run: python -m playwright install --with-deps chromium
        if: contains(matrix.target, 'py-')
      - run: python audit-verification/run.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-${{ matrix.target }}
          path: audit-reports/
